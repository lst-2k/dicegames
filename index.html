<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Room</title>
<style>
:root{--bg:#efeadb;--ink:#201c14;--card:#fffaf0;--line:#d9d0b8;--felt:#117040;--felt2:#094a29;--wood:#5a3418;--gold:#e2b94a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--ink:#f0e9d6;--card:#211d15;--line:#3d3626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f;--ink:#f0e9d6;--card:#211d15;--line:#3d3626;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif}
main{max-width:460px;margin:0 auto;padding:14px}
.felt{background:radial-gradient(ellipse at 50% 20%,var(--felt),var(--felt2));border:10px solid var(--wood);border-radius:26px;box-shadow:inset 0 0 30px #0007,0 4px 12px #0004;padding:22px 16px;color:#f6efd0;text-align:center}
h1{margin:0 0 4px;font-size:2em;color:var(--gold);text-shadow:0 2px 3px #000a}
.sub{opacity:.85;margin-bottom:16px}
.list{display:grid;gap:12px}
a.g{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 0 #0004;transition:transform .15s}
a.g:active{transform:translateY(3px);box-shadow:0 1px 0 #0004}
.ic{font-size:2.4em;line-height:1}
.g b{display:block;font-size:1.15em}.g span{font-size:.9em;opacity:.75}
footer{text-align:center;opacity:.6;font-size:.85em;margin:14px 0}
</style></head><body>
<a href="https://lst-2k.github.io/mindgames/" 
   style="position: fixed; top: 15px; left: 15px; z-index: 9999; background: #061811; color: #d4af37; border: 2px solid #d4af37; padding: 8px 16px; border-radius: 8px; font-family: sans-serif; font-size: 14px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: inline-flex; items-center: center;">
   ← Back to Games
</a>
<main>
 <div class="felt"><h1>Game Room</h1><div class="sub">Pick a game to play</div><div class="list" id="list"></div></div>
 <footer>Games save your progress on this device.</footer>
</main>
<script>
// To add a game: copy its .html file next to this one and add a line here.
const GAMES=[
 {file:'roll-the-dice.html',icon:'🎲',name:'Roll the Dice',desc:'Yahtzee-style dice game · 1–4 players'},
 {file:'shut-the-box.html',icon:'📦',name:'Shut the Box',desc:'Shut the tiles, lowest score wins · 1–4 players'}
];
document.getElementById('list').innerHTML=GAMES.map(g=>'<a class="g" href="'+g.file+'"><div class="ic">'+g.icon+'</div><div><b>'+g.name+'</b><span>'+g.desc+'</span></div></a>').join('');
</script></body></html>
